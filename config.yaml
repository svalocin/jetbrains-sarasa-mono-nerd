# JetBrains Sarasa Mono Nerd Build Configuration

font:
  version: "1.0"
  author: "svalocin"
  copyright: "Copyright (c) 2026 svalocin"
  description: "JetBrains Mono Nerd Font merged with Sarasa Mono CJK glyphs as a 2:1 CJK monospace programming font."
  url: "https://github.com/svalocin/jetbrains-sarasa-mono-nerd"
  license: "This font follows the licenses of its source fonts. JetBrains Mono: OFL-1.1, Sarasa Gothic: OFL-1.1, Nerd Fonts: MIT."
  license_url: "https://openfontlicense.org"

fonts_dir: "build/source-fonts"

variants:
  SC:
    family_name: "JetBrains Sarasa Mono Nerd SC"
    family_name_compact: "JetBrainsSarasaMonoNerdSC"
    sarasa_prefix: "SarasaMonoSC"
  TC:
    family_name: "JetBrains Sarasa Mono Nerd TC"
    family_name_compact: "JetBrainsSarasaMonoNerdTC"
    sarasa_prefix: "SarasaMonoTC"

styles:
  Regular:
    en_font: "JetBrainsMonoNLNerdFontMono-Regular.ttf"
    cn_font: "{sarasa_prefix}-Regular.ttf"
    display_name: "Regular"
  Medium:
    en_font: "JetBrainsMonoNLNerdFontMono-Medium.ttf"
    cn_font: "{sarasa_prefix}-SemiBold.ttf"
    display_name: "Medium"
  Italic:
    en_font: "JetBrainsMonoNLNerdFontMono-Italic.ttf"
    cn_font: "{sarasa_prefix}-Italic.ttf"
    display_name: "Italic"
  MediumItalic:
    en_font: "JetBrainsMonoNLNerdFontMono-MediumItalic.ttf"
    cn_font: "{sarasa_prefix}-SemiBoldItalic.ttf"
    display_name: "Medium Italic"
  Bold:
    en_font: "JetBrainsMonoNLNerdFontMono-Bold.ttf"
    cn_font: "{sarasa_prefix}-Bold.ttf"
    display_name: "Bold"
  BoldItalic:
    en_font: "JetBrainsMonoNLNerdFontMono-BoldItalic.ttf"
    cn_font: "{sarasa_prefix}-BoldItalic.ttf"
    display_name: "Bold Italic"

build:
  output_dir: "build/fonts"
  parallel: 6

width:
  en_width: 600
  cn_width: 1200
  visual_scale: 1.0
